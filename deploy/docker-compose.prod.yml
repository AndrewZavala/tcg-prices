# Production overlay — use with base compose:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d

services:
  postgres:
    ports: []
    restart: unless-stopped

  web:
    ports: []
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://manifestbread.aizo.solutions}

  scheduler:
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
  environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-manifestbread.aizo.solutions}
      ACME_EMAIL: ${ACME_EMAIL:-}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:-andre}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?Set BASIC_AUTH_HASH in .env — see deploy/README.md}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
