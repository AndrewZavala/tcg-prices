# Production overlay for Spell Tag — use with base compose:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d star-piece-db star-piece caddy

services:
  star-piece-db:
    ports: []
    restart: unless-stopped

  star-piece:
    ports: []
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${SPELLTAG_CORS_ORIGINS:-https://spelltag.com,https://www.spelltag.com}
      SPELLTAG_PUBLIC_URL: ${SPELLTAG_PUBLIC_URL:-https://spelltag.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPELLTAG_SESSION_SECRET: ${SPELLTAG_SESSION_SECRET:-}
      SPELLTAG_ADMIN_EMAILS: ${SPELLTAG_ADMIN_EMAILS:-}
      SPELLTAG_TAGGER_EMAILS: ${SPELLTAG_TAGGER_EMAILS:-}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPELLTAG_DOMAIN: ${SPELLTAG_DOMAIN:-spelltag.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - card_images:/srv/card-images:ro
    depends_on:
      - star-piece

volumes:
  caddy_data:
  caddy_config:
