# Production overlay for Spell Tag — use with base compose:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d star-piece-db star-piece caddy

services:
  star-piece-db:
    ports: []
    restart: unless-stopped

  star-piece:
    ports: []
    restart: unless-stopped
    environment:
      CORS_ORIGINS: ${SPELLTAG_CORS_ORIGINS:-https://spelltag.com,https://www.spelltag.com}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SPELLTAG_DOMAIN: ${SPELLTAG_DOMAIN:-spelltag.com}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      star-piece:
        condition: service_started

volumes:
  caddy_data:
  caddy_config:
