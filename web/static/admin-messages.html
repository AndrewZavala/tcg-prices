<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Messages — Spell Tag</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/star-piece.css?v=detail-img1" />
  <link rel="stylesheet" href="/static/spell-tag.css?v=35" />
  <link rel="icon" href="/static/spell-tag-logo.png?v=10" type="image/png" />
</head>
<body class="sp-body st-body">
  <div class="sp-stars" aria-hidden="true"></div>

  <div class="sp-topbar">
    <nav class="sp-topbar-nav" aria-label="Primary">
      <a href="/" class="sp-topbar-link">Search</a>
      <a href="/sets" class="sp-topbar-link">Sets</a>
      <a href="/contact" class="sp-topbar-link">Contact</a>
    </nav>
    <div class="sp-topbar-account">
      <a class="sp-topbar-login" href="/auth/google/login">Sign in</a>
    </div>
  </div>

  <header class="sp-nav">
    <a class="sp-brand st-brand" href="/" aria-label="Spell Tag home">
      <img
        src="/static/spell-tag-wordmark.png?v=9"
        alt="Spell Tag"
        class="st-wordmark"
        width="280"
        height="131"
      />
    </a>
    <p class="sp-tagline">Messages</p>
  </header>

  <main class="sp-main">
    <section class="sp-panel sp-messages-panel">
      <div class="sp-messages-head">
        <h2 class="sp-contact-title" id="messagesTitle">Contact messages</h2>
        <div class="sp-messages-filter" role="group" aria-label="Show">
          <button type="button" class="sp-messages-filter-btn is-active" data-status="open">Open</button>
          <button type="button" class="sp-messages-filter-btn" data-status="all">All</button>
        </div>
      </div>
      <div id="messagesRoot">
        <p class="sp-empty">Loading…</p>
      </div>
    </section>
  </main>

  <footer class="sp-footer">
    <p><strong>Spell Tag</strong> · Unofficial fan project · Not affiliated with Nintendo, Game Freak, or Creatures</p>
  </footer>

  <script src="/static/spelltag-auth.js?v=5"></script>
  <script src="/static/admin-messages.js?v=1"></script>
</body>
</html>
