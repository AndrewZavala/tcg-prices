<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Collections — Spell Tag</title>
  <meta name="description" content="Your Spell Tag card art collections." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/star-piece.css?v=spell-tag" />
  <link rel="stylesheet" href="/static/spell-tag.css?v=11" />
  <link rel="icon" href="/static/spell-tag-logo.png?v=10" type="image/png" />
</head>
<body class="sp-body st-body">
  <div class="sp-stars" aria-hidden="true"></div>

  <div class="sp-topbar">
    <nav class="sp-topbar-nav" aria-label="Primary">
      <a href="/" class="sp-topbar-link">Search</a>
      <span class="sp-topbar-link is-placeholder" title="Coming soon">Decks</span>
      <span class="sp-topbar-link is-placeholder" title="Coming soon">Sets</span>
    </nav>
    <div class="sp-topbar-account">
      <a class="sp-topbar-login" href="/auth/google/login">Sign in</a>
    </div>
  </div>

  <header class="sp-nav">
    <a class="sp-brand st-brand" href="/" aria-label="Spell Tag home">
      <img
        src="/static/spell-tag-wordmark.png?v=9"
        alt="Spell Tag"
        class="st-wordmark"
        width="280"
        height="131"
      />
    </a>
    <p class="sp-tagline">My Collections</p>
  </header>

  <main class="sp-main">
    <section class="sp-panel sp-collections-panel">
      <div id="collectionsRoot">
        <p class="sp-empty">Loading…</p>
      </div>
    </section>
  </main>

  <footer class="sp-footer">
    <p><strong>Spell Tag</strong> · Unofficial fan project · Not affiliated with Nintendo, Game Freak, or Creatures</p>
  </footer>

  <script src="/static/spelltag-auth.js?v=2"></script>
  <script src="/static/collections.js?v=2"></script>
</body>
</html>
