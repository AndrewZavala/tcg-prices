services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcg_secret}
      POSTGRES_DB: ${POSTGRES_DB:-tcg_buylist}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcg} -d ${POSTGRES_DB:-tcg_buylist}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    environment:
      TCG_ROOT: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcg}:${POSTGRES_PASSWORD:-tcg_secret}@postgres:5432/${POSTGRES_DB:-tcg_buylist}
      TZ: ${TZ:-America/New_York}
      TCG_LISTINGS_MAX_PRODUCTS: ${TCG_LISTINGS_MAX_PRODUCTS:-5000}
      TCG_LISTINGS_MAX_CASH_PRICE: ${TCG_LISTINGS_MAX_CASH_PRICE:-0}
      TCG_LISTINGS_DELAY_SEC: ${TCG_LISTINGS_DELAY_SEC:-0}
      TCG_BROWSER_CDP_URL: ${TCG_BROWSER_CDP_URL:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - manual

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    volumes:
      - ./web:/app/web
      - ./migrations:/app/migrations
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcg}:${POSTGRES_PASSWORD:-tcg_secret}@postgres:5432/${POSTGRES_DB:-tcg_buylist}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Spell Tag (own Postgres + app — separate from Manifest Bread)
  star-piece-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${STAR_PIECE_PG_USER:-starpiece}
      POSTGRES_PASSWORD: ${STAR_PIECE_PG_PASSWORD:-starpiece_secret}
      POSTGRES_DB: ${STAR_PIECE_PG_DB:-star_piece}
    ports:
      - "${STAR_PIECE_PG_PORT:-5433}:5432"
    volumes:
      - star_piece_pgdata:/var/lib/postgresql/data
      - ./migrations/star_piece_init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${STAR_PIECE_PG_USER:-starpiece} -d ${STAR_PIECE_PG_DB:-star_piece}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  star-piece:
    build:
      context: .
      dockerfile: Dockerfile.star-piece
    volumes:
      - ./web:/app/web
      - ./migrations:/app/migrations
    environment:
      DATABASE_URL: postgresql://${STAR_PIECE_PG_USER:-starpiece}:${STAR_PIECE_PG_PASSWORD:-starpiece_secret}@star-piece-db:5432/${STAR_PIECE_PG_DB:-star_piece}
      TCG_ROOT: /app
      CORS_ORIGINS: ${STAR_PIECE_CORS_ORIGINS:-http://localhost:8001,http://127.0.0.1:8001}
      TCGPLAYER_PARTNER_LINK: ${TCGPLAYER_PARTNER_LINK:-}
      TCGPLAYER_PARTNER_ID: ${TCGPLAYER_PARTNER_ID:-}
      TCGPLAYER_AD_ID: ${TCGPLAYER_AD_ID:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SPELLTAG_SESSION_SECRET: ${SPELLTAG_SESSION_SECRET:-}
      SPELLTAG_PUBLIC_URL: ${SPELLTAG_PUBLIC_URL:-http://localhost:8001}
    ports:
      - "8001:8001"
    depends_on:
      star-piece-db:
        condition: service_healthy
    command:
      [
        "uvicorn",
        "star_piece_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]

  star-piece-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.star-piece-pipeline
    environment:
      TCG_ROOT: /app
      DATABASE_URL: postgresql://${STAR_PIECE_PG_USER:-starpiece}:${STAR_PIECE_PG_PASSWORD:-starpiece_secret}@star-piece-db:5432/${STAR_PIECE_PG_DB:-star_piece}
      TZ: ${TZ:-America/New_York}
      POKEMONTCG_API_KEY: ${POKEMONTCG_API_KEY:-}
    volumes:
      - ./pipeline:/app/pipeline
      - ./migrations:/app/migrations
      - ./helper:/app/helper
    depends_on:
      star-piece-db:
        condition: service_healthy
    profiles:
      - manual

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.pipeline
    environment:
      TCG_ROOT: /app
      DATABASE_URL: postgresql://${POSTGRES_USER:-tcg}:${POSTGRES_PASSWORD:-tcg_secret}@postgres:5432/${POSTGRES_DB:-tcg_buylist}
      TZ: ${TZ:-America/New_York}
      PIPELINE_CRON: ${PIPELINE_CRON:-0 5 * * *}
      SCRYFALL_CRON: ${SCRYFALL_CRON:-0 3 * * 0}
      TCG_LISTINGS_MAX_PRODUCTS: ${TCG_LISTINGS_MAX_PRODUCTS:-5000}
      TCG_LISTINGS_MAX_CASH_PRICE: ${TCG_LISTINGS_MAX_CASH_PRICE:-0}
      TCG_LISTINGS_DELAY_SEC: ${TCG_LISTINGS_DELAY_SEC:-0}
      TCG_BROWSER_CDP_URL: ${TCG_BROWSER_CDP_URL:-}
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/app/pipeline/cron_entry.sh"]

volumes:
  pgdata:
  star_piece_pgdata:
